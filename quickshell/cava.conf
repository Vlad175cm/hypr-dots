# cava config used by the quickshell island's spectrum widget.
# It is deliberately separate from ~/.config/cava/config so the island can use
# raw output without touching your terminal setup.
[general]
framerate = 30
bars = 24

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 40
