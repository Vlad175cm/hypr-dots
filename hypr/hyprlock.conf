source = ~/.config/hypr/matugen-wall.conf

$font = Inter

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = $wallpaper
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 2
    blur_size = 5
    noise = 0.012
    contrast = 1.05
    brightness = 0.55
    vibrancy = 0.18
    vibrancy_darkness = 0.1
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(0, 0, 0, 0.22)
    zindex = 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $color_text
    font_size = 168
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $color_dim
    font_size = 24
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 56, 3
    rounding = 2
    color = $color_accent
    position = 0, -20
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = $color_dim
    font_size = 16
    font_family = $font
    position = 0, -62
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    rounding = 28
    fade_on_empty = false
    inner_color = $color_field
    outer_color = $color_accent_soft
    check_color = $color_accent
    fail_color = $color_alert
    font_color = $color_text
    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL</i>
    position = 0, -150
    halign = center
    valign = center
    zindex = 1
}
